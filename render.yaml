services:
  - type: web
    name: flagent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: STORAGE
        value: firestore
      - key: PORT
        value: 8000
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: FIRESTORE_ROOT_COLLECTION
        value: agents
      - key: FIRESTORE_CACHE_TTL_SECONDS
        value: 300
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false

