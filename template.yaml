AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Flagent — Agent Behavioral Governance Layer
  Establishes behavioural baselines for AI agents using synthetic traffic,
  then monitors production sessions against them.  Supports multi-agent
  registration with per-agent baselines and API key authentication.
  LLM provider: Google Gemini (free tier, google-genai SDK).

Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: false
    Description: Google Gemini API Key

Globals:
  Function:
    Runtime: python3.13
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        BASELINES_TABLE: "AgentBaselines"
        SESSIONS_TABLE: "SessionScores"
        AGENT_REGISTRY_TABLE: "AgentRegistry"
        GEMINI_API_KEY: !Ref GeminiApiKey
        LLM_PROVIDER: "gemini"
        LLM_MODEL: "gemini-2.0-flash"

Resources:
  # ---------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------
  BaselineApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ps41-baseline-api
      StageName: dev
      Description: API for Agent Behavioral Governance Layer
      Cors:
        AllowMethods: "'OPTIONS,POST'"
        AllowHeaders: "'Content-Type,x-flagent-key'"
        AllowOrigin: "'*'"

  # ---------------------------------------------------------------
  # DynamoDB Tables
  # ---------------------------------------------------------------

  # v2: Agent Registry — stores registered agents and hashed API keys
  AgentRegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "AgentRegistry"
      AttributeDefinitions:
        - AttributeName: agent_id
          AttributeType: S
      KeySchema:
        - AttributeName: agent_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # ---------------------------------------------------------------
  # Lambda Functions — LEGACY (v1, unchanged)
  # ---------------------------------------------------------------
  GenerateScenariosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ps41-generate-scenarios
      Handler: generate_scenarios.generate_scenarios.handler
      CodeUri: src/
      Description: >
        Given an agent's system prompt and tool list, generates 50 diverse
        synthetic test scenarios via Google Gemini.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: "AgentBaselines"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BaselineApi
            Path: /generate-scenarios
            Method: POST

  RunBaselineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ps41-run-baseline
      Handler: run_baseline.run_baseline.handler
      CodeUri: src/
      Timeout: 300
      Description: >
        Runs the agent against all synthetic scenarios and records the behavioural
        fingerprint — tool call frequency, response length stats, call sequences.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: "AgentBaselines"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BaselineApi
            Path: /run-baseline
            Method: POST

  ScoreSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ps41-score-session
      Handler: score_session.score_session.handler
      CodeUri: src/
      Description: >
        Scores a production session against the stored baseline.
        v2: multi-agent scoring via x-flagent-key auth + DynamoDB lookup.
        Legacy mode (no header) preserved for backward compatibility.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: "AgentBaselines"
        - DynamoDBCrudPolicy:
            TableName: "SessionScores"
        - DynamoDBCrudPolicy:
            TableName: "AgentRegistry"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BaselineApi
            Path: /score-session
            Method: POST

  RunDemoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ps41-run-demo
      Handler: run_demo.run_demo.handler
      CodeUri: src/
      Timeout: 120
      Description: >
        Runs a hardcoded demo scenario via Gemini agent and returns the trace.
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BaselineApi
            Path: /run-demo
            Method: POST

  # ---------------------------------------------------------------
  # Lambda Functions — v2 (multi-agent)
  # ---------------------------------------------------------------

  RegisterAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ps41-register-agent
      Handler: register_agent.register_agent.handler
      CodeUri: src/
      Description: >
        Register a new agent in the governance system. Returns a one-time
        API key that must be stored securely by the caller.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: "AgentRegistry"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BaselineApi
            Path: /agents/register
            Method: POST

  RecordBaselineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ps41-record-baseline
      Handler: record_baseline.record_baseline.handler
      CodeUri: src/
      Timeout: 300
      Description: >
        Onboarding endpoint for new agents. Accepts either
        (a) system_prompt + tool_list for LLM-generated baselines or
        (b) user-supplied session traces for direct baseline recording.
        Requires x-flagent-key authentication.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: "AgentBaselines"
        - DynamoDBCrudPolicy:
            TableName: "AgentRegistry"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BaselineApi
            Path: /agents/{agent_id}/baseline
            Method: POST

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${BaselineApi}.execute-api.${AWS::Region}.amazonaws.com/dev/"
  GenerateScenariosArn:
    Description: ARN of the GenerateScenarios Lambda
    Value: !GetAtt GenerateScenariosFunction.Arn
  RunBaselineArn:
    Description: ARN of the RunBaseline Lambda
    Value: !GetAtt RunBaselineFunction.Arn
  ScoreSessionArn:
    Description: ARN of the ScoreSession Lambda
    Value: !GetAtt ScoreSessionFunction.Arn
  RunDemoArn:
    Description: ARN of the RunDemo Lambda
    Value: !GetAtt RunDemoFunction.Arn
  RegisterAgentArn:
    Description: ARN of the RegisterAgent Lambda
    Value: !GetAtt RegisterAgentFunction.Arn
  RecordBaselineArn:
    Description: ARN of the RecordBaseline Lambda
    Value: !GetAtt RecordBaselineFunction.Arn