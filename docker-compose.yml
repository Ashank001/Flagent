version: "3.9"

services:
  flagent:
    build: .
    ports:
      - "8000:8000"
    environment:
      STORAGE: memory
      ALLOWED_ORIGINS: "*"
      # To use Firestore locally, set STORAGE=firestore and either:
      #   FIREBASE_SERVICE_ACCOUNT_JSON: '<json string>'  (Render-style)
      # or mount your credentials file and set:
      #   GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/sa.json
    # Uncomment to run with Firestore + a local credentials file:
    # volumes:
    #   - ${GOOGLE_APPLICATION_CREDENTIALS}:/run/secrets/sa.json:ro
    # environment:
    #   STORAGE: firestore
    #   GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/sa.json
    #   FIREBASE_PROJECT_ID: your-project-id

